<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Flow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1A1A1A;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            border: 1px solid #2A2A2A;
            max-width: 400px;
            margin: 20px;
        }

        .app {
            font-size: 14px;
            font-weight: 500;
            color: #B4A9C8; /* Muted Lavender brand */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 24px;
        }

        h1 {
            color: #F5F5F5;
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 16px;
        }

        p {
            color: #9CA3AF;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="app">Flow</div>
        <div class="icon">{{icon}}</div>
        <h1>{{title}}</h1>
        <p>{{message}}</p>
    </div>
</body>
</html>

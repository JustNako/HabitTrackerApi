<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - Flow</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0C1017; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #161A22; border-radius: 20px; padding: 48px 40px; text-align: center; border: 1px solid #262A34; max-width: 400px; margin: 20px; }
    .icon { font-size: 56px; margin-bottom: 20px; }
    .app { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #DA22FF, #9733EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
    h1 { color: #fff; font-size: 22px; margin: 0 0 12px; }
    p { color: #8A8F9E; font-size: 15px; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="app">Flow</div>
    <div class="icon">{{icon}}</div>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
  </div>
</body>
</html>
